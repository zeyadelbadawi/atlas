# B0-OPS-12 — every GitHub Action is pinned to a full commit SHA and every
# Dockerfile base image (SPA build, SSR renderer, Caddy builder and Caddy
# runtime) to a multi-arch index digest. Pins that nobody updates trade one
# risk (a moving tag) for another (missed security fixes), so Dependabot
# proposes the updates as reviewable pull requests: weekly, one grouped PR
# per ecosystem, at most a few open at once. Each PR goes through CI like
# any other change; nothing here merges or deploys by itself.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
    # Digest and in-major updates only: moving the runtime off Node 20 (or
    # Caddy to a new major) is its own decision, not a weekly PR.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      base-images:
        patterns: ['*']
