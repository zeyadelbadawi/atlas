name: Deploy

# Phase 7 — builds the production (Caddy + static SPA) image for
# linux/arm64 (the Oracle VPS is an Ampere/ARM instance — cross-built via
# QEMU since GitHub's runners are x86_64), pushes it to GHCR, then SSHes
# into the VPS as the restricted `deploy` user (never a personal key,
# never root) to pull and roll out the full stack.
#
# Gated on CI (2 Oct 2026): it runs only after the `CI` workflow completed
# SUCCESSFULLY for a push to `main`, and builds exactly the commit CI
# checked — a red CI never reaches production. `workflow_dispatch` remains
# for a deliberate manual redeploy of `main`.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

# P63g — one deploy at a time against the single VPS. The backend
# workflow uses the same group name; GitHub scopes groups per repository,
# so `deploy.sh` additionally takes a host-level lock (`flock`) — this
# group prevents two FRONTEND pushes from racing each other.
concurrency:
  group: atlas-vps-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    # A hung step (seen 19 Oct 2026: the arm64 QEMU build sat for 37 min)
    # fails here instead of holding the runner for the 6-hour default.
    timeout-minutes: 45  # a normal run takes 13-24 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for linux/arm64 cross-build)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Stale-tab recovery — keep the chunks of the builds that open tabs
      # are still running. The image being replaced holds the previous
      # builds' `/srv/assets` plus one `.build-<epoch>.list` per build (its
      # chunk names). A build's chunks are kept while its list is under 14
      # days old; everything else is dropped, so the set stays bounded. The
      # new build is copied over them, so its files always win. A first
      # deploy, or a failed pull, ships the new build alone.
      - name: Carry the previous builds' assets forward
        run: |
          set -u
          image="ghcr.io/${{ github.repository_owner }}/atlas-frontend:latest"
          if docker pull --platform linux/arm64 "$image"; then
            container="$(docker create --platform linux/arm64 "$image")"
            docker cp "$container:/srv/assets/." previous-assets/ || true
            docker rm "$container" >/dev/null
            now="$(date +%s)"
            if ! ls previous-assets/.build-*.list >/dev/null 2>&1; then
              # An image from before build lists existed: its chunks are the
              # immediately previous build — keep them, and give them a
              # list so they expire like any other build.
              (cd previous-assets && ls -A | grep -v '^\.gitkeep$' > ".build-$now.list")
            fi
            keep="$(mktemp)"
            for list in previous-assets/.build-*.list; do
              built="${list##*.build-}"; built="${built%.list}"
              if [ $((now - built)) -gt $((14 * 86400)) ]; then
                rm -f "$list"
              else
                cat "$list" >> "$keep"
              fi
            done
            find previous-assets -type f ! -name .gitkeep ! -name '.build-*.list' |
              while read -r file; do
                grep -qxF "$(basename "$file")" "$keep" || rm -f "$file"
              done
          fi
          echo "previous assets kept: $(find previous-assets -type f ! -name .gitkeep ! -name '.build-*.list' | wc -l)"

      - name: Build and push frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/atlas-frontend:latest
            ghcr.io/${{ github.repository_owner }}/atlas-frontend:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Phase 8 — the public website's server renderer, from the same
      # Dockerfile (`--target ssr`). Built on every push so it always
      # matches the Caddy image above; the VPS runs it only while
      # ATLAS_SSR=on in /opt/atlas/.env (deploy.sh).
      - name: Build and push public website renderer image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ssr
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/atlas-frontend-ssr:latest
            ghcr.io/${{ github.repository_owner }}/atlas-frontend-ssr:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'bash /opt/atlas/deploy.sh --frontend-only'

      # 22 Oct 2026 — the documents Cloudflare keeps at the edge (Caddyfile
      # `edge_html`: marketing pages, help center, the dashboard shell) carry
      # the `atlas-html` cache tag. Purging that tag right after the rollout
      # makes a deploy live at once, while hashed assets stay cached. The
      # token can do nothing but purge this zone's cache. A failed purge
      # fails the run (the rollout itself is already done); the documents
      # would otherwise expire on their own within a day.
      - name: Purge the edge-cached documents
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -uo pipefail
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ZONE" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ZONE_ID is not set"
            exit 1
          fi
          # Free-plan purge rate limit is a few requests a minute: retry.
          for attempt in 1 2 3; do
            response="$(curl -sS --max-time 30 -X POST \
              "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data '{"tags":["atlas-html"]}')" || response=''
            if [ "$(printf '%s' "$response" | jq -r '.success // false' 2>/dev/null)" = "true" ]; then
              echo "purged cache tag atlas-html"
              exit 0
            fi
            echo "purge attempt ${attempt} failed: $(printf '%s' "$response" | jq -c '.errors // empty' 2>/dev/null)"
            sleep 20
          done
          echo "::error::Cloudflare purge failed"
          exit 1
