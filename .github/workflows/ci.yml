name: CI

# Verification only — this workflow never builds images, never pushes and
# never deploys (that is `deploy.yml`, which runs only after this workflow succeeds for a push to `main`). It
# runs on pull requests into `main` and on `main` itself, so a change is
# checked before it merges and the merged result is checked again.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, unit tests, builds, SSR tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build (single-page app)
        run: pnpm build

      - name: Build (public website renderer)
        run: pnpm build:ssr

      - name: Renderer tests
        run: pnpm test:ssr

  theme-baseline:
    name: Public website accessibility & theme checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: Build the fixture site
        run: pnpm theme-baseline:build

      # axe (WCAG 2.2 AA + best practice, EN/AR, 390/1440), the Themes 2–5
      # retirement rendering, the brand-identity audit, palette injection
      # and the logo → Home navigation, and Riwaq (Theme 4)'s own gates
      # (axe on every page, overflow at seven widths, keyboard, reduced
      # motion), and Arabic line spacing on every page of the four
      # themes (no word's ink within 0.08 em of the line above). The pixel
      # baselines
      # (`screenshots.spec.ts`) are not run here: they were recorded with
      # one Chromium build and fonts, and a CI runner's differ, so they are
      # compared locally on that pinned browser instead.
      - name: Theme checks
        run: >-
          pnpm exec playwright test
          --config e2e/theme-baseline/playwright.config.ts
          axe.spec.ts theme-retirement.spec.ts identity.spec.ts
          palette-injection.spec.ts logo-home.spec.ts riwaq.spec.ts
          arabic-line-spacing.spec.ts

      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: theme-baseline-report
          path: e2e/theme-baseline/.results
          # `.results` is a hidden directory, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 7

  # B0-OPS-11 — the critical product journeys (sign-up, subscription bank
  # transfer and wallet/InstaPay, academy manual payments, commerce,
  # orders, watermark lookup) against a real backend built from
  # `atlas-backend` `main`. The full set runs nightly from the same
  # workflow file; see its header and e2e/FLAKY.md. Being a job of this
  # workflow, it also gates Deploy.
  journeys-critical:
    name: Critical journeys
    uses: ./.github/workflows/journeys.yml
    with:
      suite: critical
