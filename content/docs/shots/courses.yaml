# Screenshots for the "courses" help-center category (content/docs/<lang>/courses).
# Routes: src/app/routes/route-paths.ts. Labels: src/localization/resources/<lang>/*.json.
# The lesson dialog opens on another content type, so every lesson-dialog shot
# switches Content Type to Video or File first.

# ---------- course list ----------
- key: courses/course-list
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/courses
  waitFor: { text: course:list.subtitle }

- key: courses/create-button
  as: owner
