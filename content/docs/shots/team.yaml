# ---- Academy Settings: registration policy and invite links ----

- key: team/registration-section
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/settings
  waitFor: { text: academy:registration.policy.title }
  highlight: { role: radiogroup, name: academy:registration.policy.title }

- key: team/registration-choose
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/settings
  waitFor: { text: academy:registration.policy.title }
  actions:
    - scroll: { role: radiogroup, name: academy:registration.policy.title }
    # The radio's accessible name is "<label> <description>" (one <Label>
    # wraps both), so an anchored label match never finds it.
    - click: { selector: "#registration-policy-approval" }
  highlight: { text: academy:registration.policy.options.approval.label, exact: true }

- key: team/registration-save
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/settings
  waitFor: { text: academy:registration.policy.title }
  actions:
    - scroll: { role: radiogroup, name: academy:registration.policy.title }
    # The radio's accessible name is "<label> <description>" (one <Label>
    # wraps both), so an anchored label match never finds it.
    - click: { selector: "#registration-policy-approval" }
  highlight: { role: button, name: academy:registration.policy.save }

- key: team/registration-manager
  as: manager
  surface: dashboard
  path: /dashboard/academy/{academyId}/settings
  waitFor: { text: academy:registration.policy.title }
  highlight: { text: academy:registration.policy.ownerOnly }

- key: team/invites-card
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/settings
  waitFor: { text: academy:registration.policy.title }
  highlight: { text: academy:registration.invites.title, exact: true }

- key: team/invites-create-button
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/settings
  waitFor: { text: academy:registration.policy.title }
  highlight: { role: button, name: academy:registration.invites.create.trigger }

- key: team/invites-create-dialog
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/settings
  waitFor: { text: academy:registration.policy.title }
  actions:
    - scroll: { role: button, name: academy:registration.invites.create.trigger }
    - click: { role: button, name: academy:registration.invites.create.trigger }
  highlight:
    - { label: academy:registration.invites.create.maxUsesLabel }
    - { label: academy:registration.invites.create.expiresInDaysLabel }
  clip: dialog

- key: team/invites-create-submit
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/settings
  waitFor: { text: academy:registration.policy.title }
  actions:
    - scroll: { role: button, name: academy:registration.invites.create.trigger }
    - click: { role: button, name: academy:registration.invites.create.trigger }
  highlight: { role: button, name: academy:registration.invites.create.submit, nth: -1 }
  clip: dialog

- key: team/invites-revoke-button
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/settings
  waitFor: { text: academy:registration.policy.title }
  highlight: { role: button, name: academy:registration.invites.revoke.action, exact: true, nth: 0 }

- key: team/invites-revoke-confirm
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/settings
  waitFor: { text: academy:registration.policy.title }
  actions:
    - scroll: { role: button, name: academy:registration.invites.revoke.action, exact: true, nth: 0 }
    - click: { role: button, name: academy:registration.invites.revoke.action, exact: true, nth: 0 }
  highlight: { role: button, name: academy:registration.invites.revoke.confirm }
  clip: dialog

