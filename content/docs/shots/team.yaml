# Team and learners (content/docs/<lang>/team/*.md). Real routes
# (src/app/routes/route-paths.ts) and real i18n keys
# (src/localization/resources/<lang>/*.json). Captures never confirm a
# destructive action: dialogs are opened, highlighted and captured only.
# Demo people (scripts/docs/seed): learners are <key>.learner@example.com
# (salma, hana, laila = pending approval, youssef = blocked, ziad = manual
# enrollment with an expiry); karim.manager@example.com is the manager.

# ---- Members page, Team tab ----

- key: team/members-team-tab
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/members
  waitFor: { text: academy:members.addManager.triggerButton }
  highlight: { role: tab, name: academy:members.tabs.team }

- key: team/members-manager-view
  as: manager
  surface: dashboard
  path: /dashboard/academy/{academyId}/members
  waitFor: { text: academy:members.ownerOnlyAdds }
  highlight: { text: academy:members.ownerOnlyAdds }

- key: team/add-staff-buttons
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/members
  waitFor: { text: academy:members.addManager.triggerButton }
  highlight:
    - { role: button, name: academy:members.addInstructor.triggerButton }
    - { role: button, name: academy:members.addManager.triggerButton }

- key: team/add-instructor-email
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/members
  waitFor: { text: academy:members.addManager.triggerButton }
  actions:
    - click: { role: button, name: academy:members.addInstructor.triggerButton }
    - fill: { label: academy:members.addInstructor.emailLabel, value: new.instructor@example.com }
    - wait: 1500
  highlight: { label: academy:members.addInstructor.emailLabel }
  clip: dialog

- key: team/add-instructor-name
