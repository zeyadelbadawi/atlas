    - fill: { label: academy:members.addInstructor.emailLabel, value: new.instructor@example.com }
    - wait: 1500
    - fill: { label: academy:members.newAccount.nameLabel, value: { en: Sara Demo, ar: سارة تجريبي } }
  highlight: { label: academy:members.newAccount.nameLabel }
  clip: dialog

- key: team/add-instructor-submit
