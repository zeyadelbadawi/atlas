# Website builder screenshots (help center category "website").
# Real routes (src/app/routes/route-paths.ts, PublicWebsiteRouter) and real
# i18n keys (src/localization/resources/<lang>/website.json, publicWebsite.json,
# navigation.json, common.json). No shot saves, publishes or opens a message:
# dialogs are opened and captured, never confirmed, so the demo state stays
# the same for every other capture.

# ---- Overview ---------------------------------------------------------------

- key: website/overview
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/website
  waitFor: { text: website:launchChecklist.title }

- key: website/launch-checklist
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/website
  waitFor: { text: website:launchChecklist.title }
  highlight: { testId: website-launch-checklist }

- key: website/publish-bar
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/website
  waitFor: { text: website:launchChecklist.title }
  highlight: { testId: website-publish-hint }

- key: website/overview-publish
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/website
  waitFor: { text: website:launchChecklist.title }
  highlight: { testId: website-publish-changes }

- key: website/unpublish-dialog
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/website
  waitFor: { text: website:launchChecklist.title }
  actions:
    - click: { testId: website-publish-toggle }
  highlight: { role: button, name: website:publish.unpublishConfirmAction, nth: -1 }
  clip: dialog

