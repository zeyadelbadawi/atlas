# ---- Public academy site --------------------------------------------------------------

- key: website/public-home
  as: visitor
  surface: academy
  path: /
  waitFor: { text: { en: Understand every lesson, ar: افهم كل درس } }

- key: website/public-contact-form
  as: visitor
  surface: academy
  path: /contact
  waitFor: { text: website:renderer.contactSubmit }
  actions:
    - scroll: { role: button, name: website:renderer.contactSubmit }
  highlight: { role: button, name: website:renderer.contactSubmit }

- key: website/public-catalog
  as: visitor
  surface: academy
  path: /courses
  waitFor: { text: { en: Calculus Essentials, ar: أساسيات التفاضل والتكامل } }
  actions:
    - scroll: { text: { en: Calculus Essentials, ar: أساسيات التفاضل والتكامل } }

- key: website/public-course
  as: visitor
  surface: academy
  path: /courses/{courseSlug}
  waitFor: { text: website:renderer.courseDetails.signInToEnrollAction }
  highlight: { text: website:renderer.courseDetails.signInToEnrollAction, nth: 0 }
