# ---- CMS phases 2–4: the website area, the visual editor, history, checks -------
# The visual editor saves by itself a moment after a change, so these shots
# only select, open panels and dialogs: nothing is typed, added or moved on
# its page. Edits that need an unsaved page (the pre-publish check, a new
# section's settings) use the classic editor, which never saves on its own.

