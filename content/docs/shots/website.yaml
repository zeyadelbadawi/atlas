# ---- Page editor ------------------------------------------------------------------

- key: website/editor
  as: manager
  surface: dashboard
  path: /dashboard/academy/{academyId}/website/pages/{homePageId}
  waitFor: { text: website:editor.compositionTitle }
  highlight: { role: button, name: website:editor.addSection }

- key: website/editor-add-section
  as: manager
  surface: dashboard
  path: /dashboard/academy/{academyId}/website/pages/{homePageId}
  waitFor: { text: website:editor.compositionTitle }
  actions:
    - click: { role: button, name: website:editor.addSection }
  highlight: { role: menu }

- key: website/editor-section-dialog
  as: manager
  surface: dashboard
  path: /dashboard/academy/{academyId}/website/pages/{homePageId}
  waitFor: { text: website:editor.compositionTitle }
  actions:
    - click: { role: button, name: website:sections.hero.label, nth: 0 }
  highlight: { text: website:editor.optional, nth: 0 }
  clip: dialog

- key: website/editor-section-apply
  as: manager
  surface: dashboard
  path: /dashboard/academy/{academyId}/website/pages/{homePageId}
  waitFor: { text: website:editor.compositionTitle }
  actions:
    - click: { role: button, name: website:sections.hero.label, nth: 0 }
    - scroll: { role: button, name: website:editor.applyChanges }
  highlight: { role: button, name: website:editor.applyChanges }
  clip: dialog

- key: website/editor-visibility
  as: manager
  surface: dashboard
  path: /dashboard/academy/{academyId}/website/pages/{homePageId}
  waitFor: { text: website:editor.compositionTitle }
  highlight:
    - { role: button, name: website:editor.visibility.desktop, nth: 0 }
    - { role: button, name: website:editor.visibility.tablet, nth: 0 }
    - { role: button, name: website:editor.visibility.mobile, nth: 0 }

- key: website/editor-save
  as: manager
  surface: dashboard
  path: /dashboard/academy/{academyId}/website/pages/{homePageId}
  waitFor: { text: website:editor.compositionTitle }
  highlight: { testId: website-save-page }

- key: website/editor-publish-page
  as: manager
  surface: dashboard
  path: /dashboard/academy/{academyId}/website/pages/{homePageId}
  waitFor: { text: website:editor.compositionTitle }
  highlight: { testId: website-publish-page }

- key: website/page-seo-dialog
  as: manager
  surface: dashboard
  path: /dashboard/academy/{academyId}/website/pages/{homePageId}
  waitFor: { text: website:editor.compositionTitle }
  actions:
    - click: { role: button, name: website:editor.seoAction }
    - scroll: { text: website:seo.indexable }
  highlight: { text: website:seo.indexable }
  clip: dialog

- key: website/editor-faq-library
  as: manager
  surface: dashboard
  path: /dashboard/academy/{academyId}/website/pages/{homePageId}
  waitFor: { text: website:editor.compositionTitle }
  actions:
    - click: { role: button, name: website:sections.faq.label, nth: 0 }
    # The library block renders once the entries have loaded.
    - wait: 2000
    - scroll: { text: website:editor.libraryEntries }
  highlight: { text: website:editor.libraryEntries }
  clip: dialog

- key: website/contact-section-form
  as: manager
  surface: dashboard
  path: /dashboard/academy/{academyId}/website/pages
  waitFor: { text: website:pages.subtitle }
  actions:
    - click: { text: Contact, exact: true }
    - wait: 2000
    - click: { role: button, name: website:sections.contact.label, nth: 0 }
    - scroll: { text: website:fields.showForm }
  highlight: { text: website:fields.showForm }
  clip: dialog

