  as: manager
  surface: dashboard
  path: /dashboard/academy/{academyId}/website/settings?tab=seo
  waitFor: { text: website:seo.siteTitle }
  highlight:
    - { text: website:seo.siteTitle, nth: 0 }
    - { text: website:seo.metaTitle, nth: 0 }
    - { text: website:seo.metaDescription, nth: 0 }

- key: website/seo-share-image
  as: manager
  surface: dashboard
  path: /dashboard/academy/{academyId}/website/settings?tab=seo
  waitFor: { text: website:seo.siteTitle }
  actions:
    - scroll: { text: website:seo.ogImage, nth: 0 }
