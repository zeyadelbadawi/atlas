# Website builder screenshots (help center category "website").
# Real routes (src/app/routes/route-paths.ts, PublicWebsiteRouter) and real
# i18n keys (src/localization/resources/<lang>/website.json, publicWebsite.json,
# navigation.json, common.json). No shot saves, publishes or opens a message:
# dialogs are opened and captured, never confirmed, so the demo state stays
# the same for every other capture.

