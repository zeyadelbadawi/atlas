# --- DOC-TASK-005 manage-learners ------------------------------------------------
- key: tasks/learners-policy
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/settings
  waitFor: { text: academy:registration.policy.title }
  highlight: { role: button, name: academy:registration.policy.save }

- key: tasks/learners-invite-links
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/settings
  waitFor: { text: academy:registration.invites.title }
  highlight: { text: academy:registration.invites.title, exact: true }

- key: tasks/learners-add-student
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/members
  waitFor: { text: academy:members.title }
  highlight: { role: button, name: academy:members.createStudent.triggerButton }

- key: tasks/learners-students-tab
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/members?tab=students
  waitFor: { text: academy:students.table.student }
  highlight: { label: academy:students.filterByStatus }

- key: tasks/learners-student-details
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/members?tab=students
  # Clickable rows are role="button" (DataTable onRowSelect), not role="row":
  # open Salma's details by her name, as courses/issue-certificate does.
  waitFor: { text: { en: Salma Ibrahim, ar: سلمى إبراهيم } }
  actions:
    - click: { text: { en: Salma Ibrahim, ar: سلمى إبراهيم } }
    - wait: 800
  clip: dialog
