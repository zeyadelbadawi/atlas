# Academy settings screenshots (content/docs/<lang>/academy/*.md).
# Real routes (src/app/routes/route-paths.ts) and i18n keys
# (src/localization/resources/<lang>/*.json).

# --- Edit your academy profile (DOC-ACD-002) ---------------------------------

- key: academy/overview-view-profile
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}
  waitFor: { text: academy:dashboard.quickActions }
  highlight: { role: button, name: academy:dashboard.viewProfile, nth: 0 }

- key: academy/profile-basic-info
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/profile
  waitFor: { text: academy:profile.basicInfo }
  highlight: { label: academy:create.nameLabel }

- key: academy/profile-contact
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/profile
  waitFor: { text: academy:profile.contactInfo }
  highlight: { label: academy:create.contactEmailLabel }

- key: academy/profile-address
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/profile
  waitFor: { text: academy:profile.address }
  highlight: { label: academy:profile.streetLabel }

- key: academy/profile-save
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/profile
  waitFor: { text: academy:profile.basicInfo }
  highlight: { role: button, name: academy:profile.saveButton }

# --- Language, currency and time zone (DOC-ACD-003) --------------------------

- key: academy/settings-localization
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/settings
  waitFor: { text: academy:settings.localization }
  highlight: { text: academy:settings.localizationDescription }

- key: academy/settings-language
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/settings
  waitFor: { text: academy:settings.localization }
  highlight: { label: academy:create.languageLabel }

- key: academy/settings-timezone
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/settings
  waitFor: { text: academy:settings.localization }
  highlight: { label: academy:create.timezoneLabel }

- key: academy/settings-currency
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/settings
  waitFor: { text: academy:settings.localization }
  highlight: { label: academy:create.currencyLabel }

- key: academy/settings-save
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/settings
  waitFor: { text: academy:settings.localization }
  # The save bar appears only once something changed (B2).
  actions:
    - click: { label: academy:create.timezoneLabel }
    - click: { role: option, name: UTC, exact: true }
  highlight: { role: button, name: academy:settings.saveButton }

# --- Visual identity (DOC-ACD-004) ------------------------------------------

- key: academy/visual-identity
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/branding
  waitFor: { text: website:visualIdentity.logoAndColoursTitle }
  highlight: { role: link, name: navigation:items.academyBranding, nth: 0 }

- key: academy/visual-identity-logo
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/branding
  waitFor: { text: website:visualIdentity.logoAndColoursTitle }
  highlight: { role: button, name: website:brandStudio.replaceLogo }

- key: academy/visual-identity-palette
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/branding
  waitFor: { text: website:brandStudio.paletteTitle }
  highlight: { role: button, name: { en: Try another combination, ar: جرّب تركيبة أخرى } }

- key: academy/visual-identity-advanced
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/branding
  waitFor: { text: website:brandStudio.paletteTitle }
  actions:
    - click: { text: website:brandStudio.advanced }
  highlight: { text: website:brandStudio.advancedHelp }

- key: academy/visual-identity-favicon
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/branding
  waitFor: { text: website:visualIdentity.basicsTitle }
  highlight: { role: button, name: academy:branding.changeFavicon }

- key: academy/visual-identity-save
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/branding
  waitFor: { text: website:visualIdentity.logoAndColoursTitle }
  highlight: { testId: visual-identity-save }

# --- Web address (DOC-ACD-005) ----------------------------------------------

- key: academy/domain-address
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/website/settings?tab=domain
  waitFor: { text: website:domain.address.title }
  highlight: { text: website:domain.subdomain.title }

- key: academy/new-academy-reserved
  as: owner
  surface: dashboard
  path: /dashboard/provisioning/new
  waitFor: { text: provisioning:start.formTitle }
  actions:
    - fill: { label: provisioning:start.subdomainLabel, value: support }
    - wait: 2000
  highlight: { label: provisioning:start.subdomainLabel }

# Changing the address: typed only, never saved (the capture must not move
# the demo academy). The note under the field appears once it differs.
- key: academy/settings-slug
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/settings
  waitFor: { text: academy:settings.general }
  actions:
    - fill: { label: academy:create.slugLabel, value: nour-academy-new }
  highlight: { label: academy:create.slugLabel }

- key: academy/settings-slug-save
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/settings
  waitFor: { text: academy:settings.general }
  actions:
    - fill: { label: academy:create.slugLabel, value: nour-academy-new }
  highlight: { role: button, name: academy:settings.saveButton }

