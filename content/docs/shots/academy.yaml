  highlight: { label: website:domain.custom.hostnameLabel }

- key: academy/domain-progress
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/website/settings?tab=domain
  waitFor: { text: website:domain.custom.title }
  highlight: { label: website:domain.custom.steps.ariaLabel }

- key: academy/domain-check-now
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/website/settings?tab=domain
  waitFor: { text: website:domain.custom.title }
  highlight: { selector: 'button:has(svg.lucide-refresh-cw)' }

