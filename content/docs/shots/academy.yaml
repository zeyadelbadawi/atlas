# --- Switch between academies (DOC-ACD-008) ---------------------------------

- key: academy/switcher
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}
  waitFor: { text: academy:dashboard.quickActions }
  highlight: { testId: academy-switcher }

- key: academy/switcher-open
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}
  waitFor: { text: academy:dashboard.quickActions }
  actions:
    - click: { testId: academy-switcher }
  highlight: { text: academy:switcher.title }

- key: academy/switcher-search
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}
  waitFor: { text: academy:dashboard.quickActions }
  actions:
    - click: { testId: academy-switcher }
    - click: { testId: academy-switcher-search-toggle }
    - wait: 300
  highlight: { testId: academy-switcher-search }

# --- Delete an academy (DOC-ACD-010) ----------------------------------------
# Captured on the second demo academy and never confirmed.

- key: academy/delete-card
  as: owner
  surface: dashboard
  path: /dashboard/academy/{secondAcademyId}/settings?section=danger
  waitFor: { selector: '[data-testid="open-delete-academy"]' }
  actions:
    - scroll: { testId: open-delete-academy }
  highlight: { text: academy:delete.consequenceWebsite }

- key: academy/delete-button
  as: owner
  surface: dashboard
  path: /dashboard/academy/{secondAcademyId}/settings?section=danger
  waitFor: { selector: '[data-testid="open-delete-academy"]' }
  actions:
    - scroll: { testId: open-delete-academy }
  highlight: { testId: open-delete-academy }

- key: academy/delete-reason
  as: owner
  surface: dashboard
  path: /dashboard/academy/{secondAcademyId}/settings?section=danger
  waitFor: { selector: '[data-testid="open-delete-academy"]' }
  actions:
    - scroll: { testId: open-delete-academy }
    - click: { testId: open-delete-academy }
  highlight: { text: academy:delete.reasonLabel }
  clip: dialog

- key: academy/delete-type-name
  as: owner
  surface: dashboard
  path: /dashboard/academy/{secondAcademyId}/settings?section=danger
  waitFor: { selector: '[data-testid="open-delete-academy"]' }
  actions:
    - scroll: { testId: open-delete-academy }
    - click: { testId: open-delete-academy }
  highlight: { testId: delete-academy-confirmation }
  clip: dialog

- key: academy/delete-confirm
  as: owner
  surface: dashboard
  path: /dashboard/academy/{secondAcademyId}/settings?section=danger
  waitFor: { selector: '[data-testid="open-delete-academy"]' }
  actions:
    - scroll: { testId: open-delete-academy }
    - click: { testId: open-delete-academy }
  highlight: { testId: confirm-delete-academy }
  clip: dialog

