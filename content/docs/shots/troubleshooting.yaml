# Troubleshooting (DOC-TRB-*). Real routes (src/app/routes/route-paths.ts)
# and real i18n keys (src/localization/resources/<lang>/*.json). Only states
# the demo seed really has are captured: no failure is faked for a picture.

# ---- I can't sign in (DOC-TRB-002) ----
- key: troubleshooting/platform-sign-in-student-hint
  as: visitor
  surface: platform
  path: /auth/sign-in
  waitFor: { text: auth:signIn.studentHint }
  highlight: { text: auth:signIn.studentHint }

- key: troubleshooting/platform-forgot-password-link
  as: visitor
  surface: platform
  path: /auth/sign-in
  waitFor: { text: auth:signIn.studentHint }
  highlight: { role: link, name: auth:signIn.forgotPassword }

- key: troubleshooting/platform-forgot-password-form
  as: visitor
  surface: platform
  path: /auth/forgot-password
  waitFor: { text: auth:forgotPassword.subtitle }
  highlight: { role: button, name: auth:forgotPassword.submit }

- key: troubleshooting/academy-sign-in-forgot-password
  as: visitor
  surface: academy
  path: /sign-in
  waitFor: { text: publicWebsite:auth.signIn.subtitle }
  highlight: { role: link, name: auth:signIn.forgotPassword }

# ---- Device limit reached (DOC-TRB-003) ----
- key: troubleshooting/learner-devices-nav
  as: learner
  surface: academy
  path: /my
  waitFor: { text: learning:learnerDashboard.nav.devices }
  highlight: { role: link, name: learning:learnerDashboard.nav.devices }

- key: troubleshooting/learner-devices-list
  as: learner
  surface: academy
  path: /my/devices
  waitFor: { text: learning:learnerDashboard.devices.subtitle }
  highlight: { text: learning:learnerDashboard.devices.registeredTitle }

- key: troubleshooting/owner-device-policy
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/settings
  waitFor: { text: academy:protection.devices.title }
  highlight: { text: academy:protection.devices.maxDevices.label }

# ---- A lesson won't open or play (DOC-TRB-004) ----
- key: troubleshooting/learner-course-outline
  as: learner
  surface: academy
  path: /my/courses/{courseId}
  waitFor: { text: learning:learnerDashboard.courseProgress.subtitle }

- key: troubleshooting/builder-lesson-menu
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/courses/{courseId}/builder
  waitFor: { text: course:builder.subtitle }
  actions:
    - click: { role: button, name: course:builder.itemMenu.actions, nth: 0 }
  highlight: { role: menuitem, name: course:builder.lessonMenu.edit }

- key: troubleshooting/lesson-dialog-content
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/courses/{courseId}/builder
  waitFor: { text: course:builder.subtitle }
  actions:
    - click: { role: button, name: course:builder.itemMenu.actions, nth: 0 }
    - click: { role: menuitem, name: course:builder.lessonMenu.edit }
    - wait: 500
  highlight: { text: course:builder.lessonDialog.contentTypeLabel, exact: true }
  clip: dialog

- key: troubleshooting/course-settings-publish
  as: owner
  surface: dashboard
  path: /dashboard/academy/{academyId}/courses/{draftCourseId}/settings
  waitFor: { text: course:settings.publishingDescription }
  highlight: { role: button, name: course:settings.publishAction }

